<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق — Rafeeq</title>
<meta name="description" content="تنظيم الأعمال والمتابعات والإنجازات">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --border:#e3e6eb; --border-strong:#cfd4dc;
  --text:#1b1f27; --text-2:#4b5363; --text-3:#7a8394;
  --accent:#0f766e; --accent-2:#115e59; --accent-soft:#e6f4f2; --on-accent:#ffffff;
  --danger:#b42318; --danger-soft:#fdecea; --warn:#a15c07; --warn-soft:#fdf3e2;
  --info:#1d4ed8; --info-soft:#e8effd; --ok:#067647; --ok-soft:#e6f6ee; --muted-soft:#eef0f3;
  --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font: "Segoe UI", "Noto Sans Arabic", "Noto Sans", Tahoma, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --surface:#171b21; --surface-2:#1e232b; --border:#2a313b; --border-strong:#3a424e;
    --text:#e8eaee; --text-2:#b4bac5; --text-3:#858d9a;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-soft:#12302d; --on-accent:#06201d;
    --danger:#f97066; --danger-soft:#3a1d1b; --warn:#f5b056; --warn-soft:#352717;
    --info:#7ea6ff; --info-soft:#1b2540; --ok:#47cd89; --ok-soft:#14301f; --muted-soft:#232932;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

/* Layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-inline-end:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:17px}
.brand-name{font-weight:700;font-size:18px}
.brand-sub{font-size:12px;color:var(--text-3)}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-2);text-decoration:none;font-weight:500}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:var(--accent-soft);color:var(--accent-2)}
.nav-link svg{width:19px;height:19px;flex:none}
.nav-count{margin-inline-start:auto;font-size:12px;background:var(--danger);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.main{min-width:0;padding:22px 28px 90px;max-width:1040px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0;font-weight:700}
.topbar .sub{color:var(--text-3);font-size:13px}
.topbar .spacer{flex:1}
.bottom-nav,.fab,.mobile-head{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:500;font-size:14px;min-height:36px;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.nav-link:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Cards & sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.section{margin-bottom:22px}
.section-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.section-head h2{font-size:15px;margin:0;font-weight:600}
.badge{font-size:12px;background:var(--muted-soft);color:var(--text-2);border-radius:99px;padding:1px 8px;font-weight:600}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.section-note{font-size:12.5px;color:var(--text-3);margin:-4px 0 8px}

/* Rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--border);cursor:pointer;background:var(--surface)}
.list > .row:first-child{border-top:none;border-radius:var(--radius) var(--radius) 0 0}
.list > .row:last-child{border-radius:0 0 var(--radius) var(--radius)}
.list > .row:only-child{border-radius:var(--radius)}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--text-2);margin-top:2px;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--text-3);align-items:center}
.row-side{display:flex;align-items:center;gap:6px;flex:none}
.row.done .row-title{color:var(--text-3);text-decoration:line-through}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);background:transparent;flex:none;cursor:pointer;margin-top:1px;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.check.on{background:var(--ok);border-color:var(--ok);cursor:default}
.check svg{width:13px;height:13px;color:#fff}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--muted-soft);color:var(--text-2);white-space:nowrap}
.pill.s-in_progress{background:var(--info-soft);color:var(--info)}
.pill.s-waiting{background:var(--warn-soft);color:var(--warn)}
.pill.s-paused{background:var(--muted-soft);color:var(--text-2)}
.pill.s-done{background:var(--ok-soft);color:var(--ok)}
.pill.s-cancelled{background:var(--muted-soft);color:var(--text-3);text-decoration:line-through}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.p-high{background:var(--danger-soft);color:var(--danger)}
.pill.p-low{background:transparent;color:var(--text-3);border:1px solid var(--border)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--border-strong)}

/* Start card */
.start{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:22px;cursor:pointer}
.start-label{font-size:12px;font-weight:700;color:var(--accent-2);text-transform:uppercase;letter-spacing:.02em}
.start-title{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.start-why{font-size:13px;color:var(--text-2)}

/* Quick add */
.quick{display:flex;gap:8px;margin-bottom:20px}
.quick input{flex:1}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:12px;color:var(--text-3)}
.field .err{font-size:12px;color:var(--danger)}
input[type=text],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);padding:8px 11px;min-height:38px}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.radio-row{display:flex;flex-direction:column;gap:6px}
.radio-row label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--text);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input[type=search]{flex:1 1 220px;width:auto}
.filters select{width:auto;flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text-2);min-height:36px}
.seg button+button{border-inline-start:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent-2)}

/* Detail */
.detail-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.detail-title{font-size:21px;font-weight:700;margin:0;flex:1;min-width:220px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px}
.kv .k{font-size:12px;color:var(--text-3);font-weight:600}
.kv .v{font-size:14px;overflow-wrap:anywhere}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:10px 0;border-top:1px solid var(--border);font-size:14px}
.timeline li:first-child{border-top:none}
.timeline .when{font-size:12px;color:var(--text-3)}
.timeline .sys{color:var(--text-2)}
.fu{padding:12px 0;border-top:1px solid var(--border)}
.fu:first-child{border-top:none}
.fu.closed{opacity:.65}
.fu-log{margin:6px 0 0;padding-inline-start:14px;border-inline-start:2px solid var(--border);font-size:13px;color:var(--text-2)}
.fu-log div{margin-bottom:4px}
.done-box{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.links a{display:block;overflow-wrap:anywhere}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;line-height:1.2}
.stat .l{font-size:12.5px;color:var(--text-2)}

/* Banner, empty */
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--warn-soft);color:var(--warn);font-size:14px;margin-bottom:16px;flex-wrap:wrap}
.banner .spacer{flex:1}
.empty{text-align:center;padding:36px 20px;color:var(--text-2)}
.empty h3{margin:0 0 6px;color:var(--text);font-size:17px}
.empty p{margin:0 0 16px}
.muted{color:var(--text-3)}
.small{font-size:13px}

/* Dialog */
dialog{border:none;border-radius:14px;padding:0;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,18,22,.45)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border)}
.dlg-head h3{margin:0;font-size:17px;flex:1}
.dlg-body{padding:18px 20px 4px;overflow:auto;max-height:calc(100vh - 170px)}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
#confirm{width:min(440px,calc(100vw - 24px))}
#confirm .dlg-body{padding:20px}

/* Toast */
.toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:24px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
[dir=rtl] .toast{transform:translateX(50%)}
.toast.error{background:var(--danger);color:#fff}

/* Welcome */
.welcome{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.welcome .card{padding:32px;text-align:center;max-width:420px;width:100%}
.welcome .brand-mark{width:56px;height:56px;font-size:28px;margin:0 auto 14px;border-radius:14px}
.welcome .btn-group{justify-content:center;margin-top:20px}
.welcome .btn{min-width:130px;min-height:44px;font-size:15px}

.print-only{display:none}
.main:focus{outline:none}
[dir=rtl] .flip svg,[dir=rtl] svg.flip{transform:scaleX(-1)}

/* Folder status chip */
.fs-chip{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--text-2);background:transparent;border:1px solid var(--border);border-radius:99px;padding:4px 10px;cursor:pointer;text-decoration:none;font-weight:500}
.fs-chip .d{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.fs-chip.ok .d{background:var(--ok)}
.fs-chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.fs-chip.warn .d{background:var(--warn)}

/* Chat drawer */
.chat{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100vw);background:var(--surface);border-inline-start:1px solid var(--border);box-shadow:0 0 40px rgba(0,0,0,.15);z-index:30;display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.chat-head h3{margin:0;font-size:16px}
.engine{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-2);font-weight:700;text-decoration:none}
.engine.local{background:var(--muted-soft);color:var(--text-2)}
.chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.msg.bot{align-self:flex-start;background:var(--surface-2)}
.msg.note{align-self:stretch;max-width:none;background:var(--warn-soft);color:var(--warn);font-size:12.5px;border-radius:8px;padding:6px 10px}
.msg.typing{color:var(--text-3);font-style:italic}
.drafts{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.drafts.stale,.drafts.discarded{opacity:.5}
.draft-card{border:1px solid var(--border-strong);border-radius:12px;padding:12px;background:var(--surface)}
.drafts.active .draft-card{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.draft-title{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.draft-line{font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;overflow-wrap:anywhere}
.draft-line select{width:auto;min-height:30px;padding:2px 8px;font-size:13px;max-width:220px}
.draft-line select.need{border-color:var(--danger);background:var(--danger-soft)}
.chat-actions{display:flex;gap:8px;flex-wrap:wrap}
.chat-foot{border-top:1px solid var(--border);padding:10px;display:flex;gap:8px;align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-foot textarea{min-height:42px;max-height:160px;resize:none;flex:1}
.chat-foot .btn{min-height:42px;padding:0 12px}
.chat-foot .btn svg{width:18px;height:18px}
[dir=rtl] .chat-foot button[type=submit] svg{transform:scaleX(-1)}
.mic.on{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

/* Responsive */
@media (max-width: 900px){
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 720px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:12px 16px 110px}
  .mobile-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .mobile-head .spacer{flex:1}
  .bottom-nav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--border);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--text-3);text-decoration:none;min-height:54px}
  .bottom-nav a.active{color:var(--accent)}
  .bottom-nav svg{width:21px;height:21px}
  .fab{display:grid;place-items:center;position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));inset-inline-end:16px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:none;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:11;cursor:pointer}
  .fab svg{width:24px;height:24px}
  .topbar .desk-only{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .row{padding:12px}
  .row-side .btn-txt{display:none}
}

/* Print */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000;font-size:12px}
  .sidebar,.bottom-nav,.fab,.mobile-head,.no-print,.toast,dialog,.chat{display:none!important}
  .app{display:block}
  .main{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc}
  .row{cursor:default;break-inside:avoid}
  .print-only{display:block}
  .check{display:none!important}
  .stats{grid-template-columns:repeat(4,1fr)}
  a{color:#000;text-decoration:none}
}
</style>

<body>
<noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript. / This app requires JavaScript.</noscript>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div>
    <header class="mobile-head" id="mobileHead"></header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<button class="fab" id="fab" data-action="chat-open" type="button"></button>

<dialog id="dlg"></dialog>
<dialog id="confirm"></dialog>
<div id="welcome" class="welcome" hidden></div>
<aside id="chat" class="chat" hidden aria-label="chat"></aside>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
/* =========================================================
   رفيق — Rafeeq · personal work organizer
   Data stays in this browser (localStorage). No server.
   ========================================================= */

const APP_VERSION = '1.1.0';
const STORE_KEY = 'rafeeq.v1';

/* ---------- i18n ---------- */
const I18N = {
  ar: {

    status_not_started:'لم تبدأ', status_in_progress:'جارٍ التنفيذ', status_waiting:'بانتظار', status_paused:'متوقفة', status_done:'مكتملة', status_cancelled:'ملغاة',
    prio_high:'عالية', prio_medium:'متوسطة', prio_low:'منخفضة', prioLabel:'أولوية {p}',
    priority:'الأولوية', status:'الحالة', due:'موعد التسليم', noDue:'بدون موعد', role:'دوري في المهمة',
    role_exec:'تنفيذ شخصي', role_follow:'متابعة تنفيذ', role_both:'تنفيذ ومتابعة',
    title:'العنوان', desc:'المطلوب والتفاصيل', project:'الملف أو المشروع', projectHint:'اختياري — لتجميع المهام المرتبطة',
    source:'مصدر التكليف', sourcePh:'مثال: المدير المباشر',
    waitingOn:'بانتظار مَن', waitingWhat:'بانتظار ماذا', wait_reply:'رد', wait_decision:'قرار', wait_approval:'اعتماد',

/* ---------- state ---------- */
let storageOK = true;
let db = loadDB();
let ui = { taskFilter:{q:'', view:'active', status:'', prio:'', person:'', project:''}, winsMonth:null };

function emptyDB(){ return {app:'rafeeq', version:1, tasks:[], people:[], settings:{lang:null, lastBackup:null}, monthNotes:{}}; }
function migrate(d){
  const base = emptyDB();
  if (!d || typeof d !== 'object') return base;
  d.app = 'rafeeq'; d.version = 1;
  d.tasks = Array.isArray(d.tasks) ? d.tasks : [];
  d.people = Array.isArray(d.people) ? d.people : [];
  d.settings = Object.assign(base.settings, d.settings || {});
  d.monthNotes = d.monthNotes && typeof d.monthNotes === 'object' ? d.monthNotes : {};
  d.tasks.forEach(tk => { tk.followups = Array.isArray(tk.followups) ? tk.followups : []; tk.log = Array.isArray(tk.log) ? tk.log : []; tk.followups.forEach(f => { f.log = Array.isArray(f.log) ? f.log : []; }); });
  return d;
}
function loadDB(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? migrate(JSON.parse(raw)) : emptyDB();
  } catch(e){ storageOK = false; return emptyDB(); }
}
function persist(){
  try {
    db.savedAt = nowISO();
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
    if (typeof scheduleFolderSave === 'function') scheduleFolderSave();
    return true;
  } catch(e){ toast(t('saveFailed'), 'error'); return false; }
}

  let s = (I18N[lang()] && I18N[lang()][key]) ?? I18N.en[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return toDateStr(d); };
const diffDays = (a,b) => Math.round((parseDate(a) - parseDate(b)) / 86400000);
const isoLocalDate = iso => toDateStr(new Date(iso));
const nowISO = () => new Date().toISOString();
const locale = () => lang()==='ar' ? 'ar-u-ca-gregory-nu-latn' : 'en-GB';
function fmtDate(s, rel=true){
  if (!s) return '';
  if (rel){ const dd = diffDays(s, todayStr()); if (dd===0) return t('today'); if (dd===1) return t('tomorrow'); if (dd===-1) return t('yesterday'); }
  const d = parseDate(s); const sameYear = d.getFullYear() === new Date().getFullYear();
  return new Intl.DateTimeFormat(locale(), sameYear ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'}).format(d);
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return fmtDate(toDateStr(d)) + ' · ' + new Intl.DateTimeFormat(locale(), {hour:'numeric', minute:'2-digit'}).format(d);
}
function fmtMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Intl.DateTimeFormat(locale(), {month:'long', year:'numeric'}).format(new Date(y, m-1, 1)); }
function arPlural(n, base){ if (n===0 && I18N.ar[base+'0']) return t(base+'0'); if (n===1) return t(base+'1'); if (n===2) return t(base+'2'); if (n>=3 && n<=10) return t(base+'Few',{n}); return t(base+'Many',{n}); }
function daysText(n){ if (lang()!=='ar') return n===1 ? t('days1') : t('daysMany',{n}); if (n===1) return t('days1'); if (n===2) return t('days2'); if (n<=10) return t('daysFew',{n}); return t('daysMany',{n}); }
const isOpen = tk => OPEN_STATUSES.includes(tk.status);
const isLate = tk => isOpen(tk) && tk.due && tk.due < todayStr();
const fuLate = f => f.status==='open' && f.due && f.due < todayStr();
const personById = id => db.people.find(p => p.id === id);
const personName = id => id ? (personById(id)?.name ?? t('deletedPerson')) : '';
const taskById = id => db.tasks.find(x => x.id === id);
const normName = s => s.trim().replace(/\s+/g,' ').toLowerCase();
function getOrCreatePerson(name){
  const n = (name||'').trim().replace(/\s+/g,' ');
  if (!n) return null;
  const found = db.people.find(p => normName(p.name) === normName(n));
  if (found) return found.id;
  const p = {id:uid(), name:n, org:'', contact:'', notes:'', createdAt:nowISO()};
  db.people.push(p); return p.id;
}
function addLog(tk, kind, data={}, text=''){ tk.log.push({id:uid(), at:nowISO(), kind, data, text}); tk.updatedAt = nowISO(); }
function logText(e){
  const d = e.data || {};
  switch(e.kind){
    case 'created': return t('log_created');
    case 'status': return t('log_status', {a:t('status_'+d.from), b:t('status_'+d.to)});
    case 'due': return t('log_due', {d: d.to ? fmtDate(d.to,false) : t('noDue')});
    case 'completed': return t('log_completed');
    case 'reopened': return t('log_reopened', {d: d.prev ? fmtDate(d.prev,false) : '—'});
    case 'fu': return t('log_fu', {p: esc(personName(d.personId)), m: t('m_'+(d.method||'other'))});
    case 'fu_added': return t('log_fu_added', {p: esc(personName(d.personId)), w: esc(d.what||'')});
    case 'fu_closed': return t('log_fu_closed', {p: esc(personName(d.personId))});
    case 'archived': return t('log_archived');
    case 'unarchived': return t('log_unarchived');
    default: return '';
  }
}
function sortTasks(list){
  const td = todayStr();
  return list.slice().sort((a,b) => {
    const la = isLate(a)?0:1, lb = isLate(b)?0:1; if (la!==lb) return la-lb;
    const da = a.due || '9999', dbb = b.due || '9999'; if (da!==dbb) return da < dbb ? -1 : 1;
    const pa = PRIO_RANK[a.priority]??1, pb = PRIO_RANK[b.priority]??1; if (pa!==pb) return pa-pb;
    return (a.createdAt||'') < (b.createdAt||'') ? -1 : 1;
  });
}
function nextFollowup(tk){ return tk.followups.filter(f => f.status==='open').sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : 1)[0]; }

}
function render(keepScroll){
  const route = parseRoute();

function backupBanner(){
  if (folder.state === 'needs-permission') return `<div class="banner no-print"><span>${t('fsBanner')}</span><span class="spacer"></span><button class="btn btn-sm" data-action="fs-reconnect" type="button">${t('fsReconnect')}</button></div>`;
  if (folder.state === 'connected' || !db.tasks.length) return '';
  const lb = db.settings.lastBackup;
  if (lb && diffDays(todayStr(), isoLocalDate(lb)) < 7) return '';
  const firstTask = db.tasks.reduce((m,x) => !m || x.createdAt < m ? x.createdAt : m, null);
  if (!lb && firstTask && diffDays(todayStr(), isoLocalDate(firstTask)) < 7 && !FS_SUPPORTED) return '';
  const msg = FS_SUPPORTED ? t('fsNoneText') : t('backupBanner');
  return `<div class="banner no-print"><span>${msg}</span><span class="spacer"></span>${FS_SUPPORTED ? `<button class="btn btn-sm btn-primary" data-action="fs-pick" type="button">${t('linkFolder')}</button>` : ''}<button class="btn btn-sm" data-action="export" type="button">${t('backupNow')}</button></div>`;
}
function quickAdd(){
  return `<form class="quick no-print" data-form="quick" autocomplete="off"><input type="text" name="title" placeholder="${esc(t('quickAddPh'))}" aria-label="${esc(t('quickAddPh'))}" dir="auto" maxlength="300"><button class="btn btn-primary" type="submit">${t('add')}</button></form>`;
}

/* ---------- views ---------- */
const VIEWS = {
  today(){
    const td = todayStr();
    const active = db.tasks.filter(x => !x.archived && isOpen(x));
    const head = `<div class="topbar"><div><h1>${t('nav_today')}</h1><div class="sub">${new Intl.DateTimeFormat(locale(), {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(new Date())}</div></div><span class="spacer"></span><button class="btn btn-primary desk-only" data-action="new-task" type="button">${IC.plus}${t('newTask')}</button></div>`;
    if (!db.tasks.length) return head + quickAdd() + emptyBlock(t('emptyTitle'), t('emptyHint'), `<button class="btn btn-primary" data-action="new-task" type="button">${IC.plus}${t('newTask')}</button>`);

    const overdue = sortTasks(active.filter(x => x.due && x.due < td));
    const dueToday = sortTasks(active.filter(x => x.due === td));
    const fus = [];
    active.forEach(tk => tk.followups.forEach(f => { if (f.status==='open' && f.due && f.due <= td) fus.push([tk,f]); }));
    fus.sort((a,b) => a[1].due < b[1].due ? -1 : 1);
    const waiting = sortTasks(active.filter(x => x.status==='waiting' && !(x.due && x.due <= td)));
    const upcoming = sortTasks(active.filter(x => x.due && x.due > td && x.due <= addDays(td,7) && x.status!=='waiting'));
    const progNoDue = sortTasks(active.filter(x => !x.due && x.status==='in_progress'));

    // suggestion: actionable (not waiting/paused), ranked
    const actionable = active.filter(x => x.status==='not_started' || x.status==='in_progress');
    let pick = null, why = '';
    const r1 = sortTasks(actionable.filter(x => x.due && x.due < td));
    const r2 = sortTasks(actionable.filter(x => x.due === td));
    const r3 = sortTasks(actionable.filter(x => x.priority==='high'));
    const r4 = sortTasks(actionable.filter(x => x.status==='in_progress'));
    const r5 = sortTasks(actionable);
    if (r1[0]) { pick = r1[0]; why = t('why_overdue',{d:daysText(diffDays(td, pick.due))}); }
    else if (r2[0]) { pick = r2[0]; why = t('why_today'); }
    else if (r3[0]) { pick = r3[0]; why = t('why_high'); }
    else if (r4[0]) { pick = r4[0]; why = t('why_progress'); }
    else if (r5[0]) { pick = r5[0]; why = r5[0].due ? t('why_next') : ''; }

    let html = head + `<div id="bannerSlot">${backupBanner()}</div>` + quickAdd();
    if (pick) html += `<div class="start" role="link" tabindex="0" data-href="#task/${pick.id}"><div style="flex:1;min-width:0"><div class="start-label">${t('startWith')}</div><div class="start-title" dir="auto">${esc(pick.title)}</div>${why?`<div class="start-why">${why}</div>`:''}</div><button type="button" class="btn btn-primary" data-action="complete" data-id="${pick.id}">${IC.check}${t('complete')}</button></div>`;
    if (overdue.length) html += section(t('sec_overdue'), overdue.length, overdue.map(x=>taskRow(x)).join(''), {danger:true});
    if (dueToday.length) html += section(t('sec_today'), dueToday.length, dueToday.map(x=>taskRow(x)).join(''));
    if (fus.length) html += section(t('sec_followups'), fus.length, fus.map(([tk,f])=>fuRow(tk,f)).join(''));
    if (waiting.length) html += section(t('sec_waiting'), waiting.length, waiting.map(x=>taskRow(x,{hideStatus:true})).join(''));
    if (upcoming.length) html += section(t('sec_upcoming'), upcoming.length, upcoming.map(x=>taskRow(x)).join(''));
    if (progNoDue.length) html += section(t('sec_progress'), progNoDue.length, progNoDue.map(x=>taskRow(x,{hideStatus:true})).join(''));
    if (!overdue.length && !dueToday.length && !fus.length) html += `<div class="card empty" style="padding:22px"><h3>${t('allClear')}</h3><p style="margin:0">${t('allClearHint')}</p></div>`;
    return html;
  },

  tasks(){
    const f = ui.taskFilter;
    const projects = [...new Set(db.tasks.map(x => (x.project||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    let list = db.tasks.slice();
    if (f.view==='active') list = list.filter(x => !x.archived && isOpen(x));
    else if (f.view==='completed') list = list.filter(x => !x.archived && (x.status==='done' || x.status==='cancelled'));
    else if (f.view==='archived') list = list.filter(x => x.archived);
    if (f.status) list = list.filter(x => x.status===f.status);
    if (f.prio) list = list.filter(x => x.priority===f.prio);
    if (f.project) list = list.filter(x => (x.project||'').trim()===f.project);
    if (f.person) list = list.filter(x => x.waitingOn===f.person || x.followups.some(fu => fu.personId===f.person));
    if (f.q.trim()){
      const q = f.q.trim().toLowerCase();
      list = list.filter(x => [x.title, x.desc, x.project, x.source, x.notes, x.result, x.links, ...x.followups.map(fu => fu.what + ' ' + personName(fu.personId)), ...x.log.map(e=>e.text)].join(' ').toLowerCase().includes(q));
    }
    list = f.view==='completed' ? list.sort((a,b) => (b.completedAt||b.updatedAt||'') > (a.completedAt||a.updatedAt||'') ? 1 : -1) : sortTasks(list);
    const statusOpts = (f.view==='completed' ? ['done','cancelled'] : f.view==='active' ? OPEN_STATUSES : STATUSES);
    const views = [['active','active'],['completed','completedF'],['archived','archivedF'],['all','allF']];
    return `<div class="topbar"><div><h1>${t('nav_tasks')}</h1><div class="sub">${lang()==='ar' ? arPlural(list.length,'tk') : t('countTasks',{n:list.length})}</div></div><span class="spacer"></span><button class="btn btn-primary desk-only" data-action="new-task" type="button">${IC.plus}${t('newTask')}</button></div>
      ${quickAdd()}
      <div class="filters no-print">
        <div class="seg" role="group">${views.map(([k,l]) => `<button type="button" class="${f.view===k?'on':''}" data-action="tf-view" data-v="${k}" aria-pressed="${f.view===k}">${t(l)}</button>`).join('')}</div>
        <input type="search" id="taskSearch" value="${esc(f.q)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}" dir="auto">
        <select data-filter="status" aria-label="${esc(t('status'))}"><option value="">${t('allStatuses')}</option>${statusOpts.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${t('status_'+s)}</option>`).join('')}</select>
        <select data-filter="prio" aria-label="${esc(t('priority'))}"><option value="">${t('allPrio')}</option>${PRIOS.map(p=>`<option value="${p}" ${f.prio===p?'selected':''}>${t('prio_'+p)}</option>`).join('')}</select>
        ${db.people.length ? `<select data-filter="person" aria-label="${esc(t('person'))}"><option value="">${t('allPeople')}</option>${db.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${f.person===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>` : ''}
        ${projects.length ? `<select data-filter="project" aria-label="${esc(t('project'))}"><option value="">${t('allProjects')}</option>${projects.map(p=>`<option value="${esc(p)}" ${f.project===p?'selected':''}>${esc(p)}</option>`).join('')}</select>` : ''}
      </div>
      ${list.length ? `<div class="card list">${list.map(x=>taskRow(x)).join('')}</div>` :
        (db.tasks.length ? `<div class="card empty"><p style="margin:0">${t('noResults')}</p></div>` : emptyBlock(t('emptyTitle'), t('emptyHint'), `<button class="btn btn-primary" data-action="new-task" type="button">${IC.plus}${t('newTask')}</button>`))}`;
  },

  task(id){
    const tk = taskById(id);
    if (!tk) return `<div class="card empty"><p>${t('notFound')}</p><a class="btn" href="#tasks">${t('back')}</a></div>`;
    const done = tk.status==='done';
    const links = (tk.links||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const kv = [
      [t('due'), tk.due ? fmtDate(tk.due,false) + (isLate(tk) ? ` <span class="pill late">${t('overdueBy',{d:daysText(diffDays(todayStr(), tk.due))})}</span>`:'') : t('noDue')],
      [t('priority'), t('prio_'+tk.priority)],
      [t('role'), t('role_'+tk.role)],
      tk.project ? [t('project'), `<span dir="auto">${esc(tk.project)}</span>`] : null,
      tk.source ? [t('source'), `<span dir="auto">${esc(tk.source)}</span>`] : null,
      tk.status==='waiting' ? [t('status'), waitingText(tk)] : null,
    ].filter(Boolean);
    const fus = tk.followups.slice().sort((a,b) => (a.status===b.status ? ((a.due||'') < (b.due||'') ? -1 : 1) : a.status==='open' ? -1 : 1));
    const log = tk.log.slice().reverse();
    return `
      <div class="topbar no-print"><a class="btn btn-ghost btn-sm flip" href="#tasks">${IC.back}${t('nav_tasks')}</a></div>
      <div class="detail-head">
        <h1 class="detail-title" dir="auto">${esc(tk.title)}</h1>
        <div class="btn-group no-print">
          ${isOpen(tk) ? `<select data-action-change="set-status" data-id="${tk.id}" aria-label="${esc(t('status'))}" style="width:auto">${OPEN_STATUSES.concat(['cancelled']).map(s=>`<option value="${s}" ${tk.status===s?'selected':''}>${t('status_'+s)}</option>`).join('')}</select>
            <button type="button" class="btn btn-primary" data-action="complete" data-id="${tk.id}">${IC.check}${t('complete')}</button>` : `${statusPill(tk.status)} <button type="button" class="btn" data-action="reopen" data-id="${tk.id}">${t('reopen')}</button>`}
          <button type="button" class="btn" data-action="edit-task" data-id="${tk.id}">${t('edit')}</button>
          <button type="button" class="btn" data-action="archive" data-id="${tk.id}">${tk.archived?t('unarchive'):t('archive')}</button>
          <button type="button" class="btn btn-danger" data-action="delete-task" data-id="${tk.id}">${t('del')}</button>
        </div>
      </div>
      ${done ? `<div class="done-box"><strong>${t('completedBox',{d:fmtDate(tk.completedAt,false)})}</strong>${tk.result?`<div class="prose" dir="auto" style="margin-top:6px">${esc(tk.result)}</div>`:''}${tk.deliverable?`<div style="margin-top:6px" class="links">${linkHtml(tk.deliverable)}</div>`:''}</div>` : ''}
      <div class="cols">
        <div>
          <div class="card card-pad section">
            <div class="kv">${kv.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
            ${tk.desc ? `<div style="margin-top:16px"><div class="k small muted" style="font-weight:600">${t('desc')}</div><div class="prose" dir="auto">${esc(tk.desc)}</div></div>` : ''}
            ${links.length ? `<div style="margin-top:16px" class="links"><div class="small muted" style="font-weight:600">${t('links')}</div>${links.map(linkHtml).join('')}</div>` : ''}
            ${tk.notes ? `<div style="margin-top:16px" class="no-print"><div class="small muted" style="font-weight:600">${t('notes')}</div><div class="prose" dir="auto">${esc(tk.notes)}</div></div>` : ''}
          </div>
          <section class="section">
            <div class="section-head"><h2>${t('followups')}</h2><span class="badge">${tk.followups.filter(f=>f.status==='open').length}</span><span style="flex:1"></span><button type="button" class="btn btn-sm no-print" data-action="add-fu" data-task="${tk.id}">${IC.plus}${t('addFollowup')}</button></div>
            <div class="card card-pad">${fus.length ? fus.map(f => fuBlock(tk,f)).join('') : `<div class="muted small">${t('noFollowups')}</div>`}</div>
          </section>
        </div>
        <section class="section">
          <div class="section-head"><h2>${t('updates')}</h2></div>
          <div class="card card-pad">
            <form data-form="update" data-task="${tk.id}" class="no-print" style="margin-bottom:8px">
              <textarea name="text" placeholder="${esc(t('updatePh'))}" aria-label="${esc(t('addUpdate'))}" dir="auto" style="min-height:64px"></textarea>
              <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn btn-sm btn-primary" type="submit">${t('addUpdate')}</button></div>
            </form>
            ${log.length ? `<ul class="timeline">${log.map(e => `<li><div class="when">${fmtDateTime(e.at)}</div>${e.kind==='note' ? `<div class="prose" dir="auto">${esc(e.text)}</div>` : `<div class="sys">${logText(e)}</div>${e.text?`<div class="prose" dir="auto">${esc(e.text)}</div>`:''}`}</li>`).join('')}</ul>` : `<div class="muted small">${t('noUpdates')}</div>`}
          </div>
        </section>
      </div>`;
  },

  people(){
    const td = todayStr();
    const rows = db.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p => {
      const openF = [], waits = [];
      let last = null;
      db.tasks.forEach(tk => {
        tk.followups.forEach(f => { if (f.personId===p.id){ if (f.status==='open' && isOpen(tk) && !tk.archived) openF.push(f); f.log.forEach(l => { if (!last || l.date > last) last = l.date; }); } });
        if (tk.waitingOn===p.id && tk.status==='waiting' && !tk.archived) waits.push(tk);
      });
      const late = openF.filter(f => f.due && f.due < td).length;
      return `<div class="row" role="link" tabindex="0" data-href="#person/${p.id}"><div class="row-main"><div class="row-title" dir="auto">${esc(p.name)}</div>${p.org?`<div class="row-sub" dir="auto">${esc(p.org)}</div>`:''}
        <div class="row-meta">${openF.length?`<span class="pill ${late?'late':''}">${t('openFollowups')}: ${openF.length}</span>`:''}${waits.length?`<span class="pill s-waiting">${t('waitingTasks')}: ${waits.length}</span>`:''}<span>${last ? t('lastContact',{d:fmtDate(last)}) : t('noContact')}</span></div></div></div>`;
    }).join('');
    return `<div class="topbar"><div><h1>${t('people')}</h1></div><span class="spacer"></span><button class="btn" data-action="add-person" type="button">${IC.plus}${t('addPerson')}</button></div>
      ${db.people.length ? `<div class="card list">${rows}</div>` : emptyBlock(t('emptyPeople'), t('emptyPeopleHint'), `<button class="btn" data-action="add-person" type="button">${IC.plus}${t('addPerson')}</button>`)}`;
  },

  person(id){
    const p = personById(id);
    if (!p) return `<div class="card empty"><p>${t('notFound')}</p><a class="btn" href="#people">${t('back')}</a></div>`;
    const openF = [], closedEntries = [], waits = [], related = new Set();
    db.tasks.forEach(tk => {
      tk.followups.forEach(f => {
        if (f.personId!==p.id) return;
        related.add(tk.id);
        if (f.status==='open' && isOpen(tk) && !tk.archived) openF.push([tk,f]);
        f.log.forEach(l => closedEntries.push({tk, f, l}));
      });
      if (tk.waitingOn===p.id){ related.add(tk.id); if (tk.status==='waiting' && !tk.archived) waits.push(tk); }
    });
    openF.sort((a,b) => (a[1].due||'9999') < (b[1].due||'9999') ? -1 : 1);
    closedEntries.sort((a,b) => (b.l.date + b.l.at) > (a.l.date + a.l.at) ? 1 : -1);
    const relTasks = sortTasks([...related].map(taskById).filter(Boolean));
    return `<div class="topbar no-print"><a class="btn btn-ghost btn-sm flip" href="#people">${IC.back}${t('nav_people')}</a></div>
      <div class="detail-head"><div style="flex:1;min-width:220px"><h1 class="detail-title" dir="auto">${esc(p.name)}</h1>${p.org?`<div class="muted" dir="auto">${esc(p.org)}</div>`:''}</div>
        <div class="btn-group"><button class="btn" data-action="edit-person" data-id="${p.id}" type="button">${t('edit')}</button><button class="btn btn-danger" data-action="delete-person" data-id="${p.id}" type="button">${t('del')}</button></div></div>
      ${(p.contact||p.notes) ? `<div class="card card-pad section"><div class="kv">${p.contact?`<div><div class="k">${t('contact')}</div><div class="v prose" dir="auto">${esc(p.contact)}</div></div>`:''}${p.notes?`<div><div class="k">${t('personNotes')}</div><div class="v prose" dir="auto">${esc(p.notes)}</div></div>`:''}</div></div>` : ''}
      ${openF.length ? section(t('openFollowups'), openF.length, openF.map(([tk,f])=>fuRow(tk,f)).join('')) : ''}
      ${waits.length ? section(t('waitingTasks'), waits.length, waits.map(x=>taskRow(x,{hideStatus:true})).join('')) : ''}
      ${closedEntries.length ? `<section class="section"><div class="section-head"><h2>${t('contactHistory')}</h2><span class="badge">${closedEntries.length}</span></div><div class="card card-pad"><ul class="timeline">${closedEntries.map(({tk,f,l}) => `<li><div class="when">${fmtDate(l.date,false)} · ${t('m_'+l.method)}</div><div dir="auto"><strong>${esc(f.what)}</strong></div>${l.text?`<div class="prose" dir="auto">${esc(l.text)}</div>`:''}<div class="small"><a href="#task/${tk.id}" dir="auto">${esc(tk.title)}</a></div></li>`).join('')}</ul></div></section>` : ''}
      ${relTasks.length ? section(t('relatedTasks'), relTasks.length, relTasks.map(x=>taskRow(x)).join('')) : ''}`;
  },

  wins(){
    if (!ui.winsMonth) ui.winsMonth = todayStr().slice(0,7);
    const ym = ui.winsMonth;
    const inMonth = d => d && d.slice(0,7) === ym;
    const completed = db.tasks.filter(x => x.status==='done' && inMonth(x.completedAt)).sort((a,b)=> a.completedAt < b.completedAt ? -1 : 1);
    let fuClosed = 0, contacts = 0;
    db.tasks.forEach(tk => tk.followups.forEach(f => { if (f.status==='closed' && inMonth(f.closedOn)) fuClosed++; f.log.forEach(l => { if (inMonth(l.date)) contacts++; }); }));
    const progress = db.tasks.filter(x => x.status!=='done' && x.status!=='cancelled').map(x => {
      const ents = x.log.filter(e => ['note','fu','status','fu_added'].includes(e.kind) && inMonth(isoLocalDate(e.at)));
      return ents.length ? {tk:x, n:ents.length, last:ents[ents.length-1]} : null;
    }).filter(Boolean);
    const blocked = db.tasks.filter(x => !x.archived && (x.status==='waiting' || x.status==='paused'));
    const rc = {exec:0, follow:0, both:0}; completed.forEach(x => rc[x.role] = (rc[x.role]||0)+1);
    const note = db.monthNotes[ym] || '';
    const stat = (n,l) => `<div class="card stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
    return `<div class="topbar no-print"><div><h1>${t('winsTitle')}</h1><div class="sub">${fmtMonth(ym)}</div></div><span class="spacer"></span>
        <input type="month" class="no-print" data-action-change="wins-month" value="${ym}" max="${todayStr().slice(0,7)}" aria-label="${esc(t('month'))}" style="width:auto">
        <button class="btn btn-primary no-print" data-action="print" type="button">${t('print')}</button></div>
      <div class="print-only" style="margin-bottom:12px"><div class="small muted">${t('appName')} · ${t('generatedOn',{d:fmtDate(todayStr(),false)})}</div><h2 style="margin:4px 0">${t('reportFor',{m:fmtMonth(ym)})}</h2><div id="printSummary" class="prose" dir="auto">${esc(note)}</div></div>
      <div class="field no-print"><label for="monthNote">${t('summary')}</label><textarea id="monthNote" dir="auto" placeholder="${esc(t('summaryPh'))}">${esc(note)}</textarea></div>
      <div class="stats">${stat(completed.length, t('st_completed'))}${stat(progress.length, t('st_progress'))}${stat(fuClosed, t('st_fuClosed'))}${stat(contacts, t('st_contacts'))}</div>
      <section class="section"><div class="section-head"><h2>${t('completedList')}</h2><span class="badge">${completed.length}</span></div>
        ${completed.length ? `<p class="section-note">${t('roleSplit',{a:rc.exec,b:rc.follow,c:rc.both})}</p><div class="card list">${completed.map(x => `<div class="row" role="link" tabindex="0" data-href="#task/${x.id}"><div class="row-main"><div class="row-title" dir="auto">${esc(x.title)}</div>${x.result?`<div class="row-sub prose" dir="auto">${esc(x.result)}</div>`:''}<div class="row-meta"><span>${fmtDate(x.completedAt,false)}</span><span class="pill">${t('role_'+x.role)}</span>${x.project?`<span dir="auto">${esc(x.project)}</span>`:''}</div></div></div>`).join('')}</div>` : `<div class="card empty" style="padding:20px"><p style="margin:0">${t('noWins')}</p></div>`}
      </section>
      <section class="section"><div class="section-head"><h2>${t('progressList')}</h2><span class="badge">${progress.length}</span></div>
        ${progress.length ? `<div class="card list">${progress.map(({tk,n,last}) => `<div class="row" role="link" tabindex="0" data-href="#task/${tk.id}"><div class="row-main"><div class="row-title" dir="auto">${esc(tk.title)}</div><div class="row-sub" dir="auto">${t('lastUpd',{t: last.kind==='note' ? esc(last.text) : logText(last)})}</div><div class="row-meta">${statusPill(tk.status)}<span>${lang()==='ar' ? arPlural(n,'upd') : t('updatesN',{n})}</span></div></div></div>`).join('')}</div>` : `<div class="card empty" style="padding:20px"><p style="margin:0">${t('noProgress')}</p></div>`}
      </section>
      ${blocked.length ? section(t('blockedNow'), blocked.length, blocked.map(x=>taskRow(x,{hideFu:true})).join(''), {note:t('blockedNote')}) : ''}`;
  },

  settings(){
    const lb = db.settings.lastBackup;
    const ai = aiCfg();
    return `<div class="topbar"><h1>${t('settings')}</h1></div>
      <div class="card card-pad section"><div class="field" style="margin:0"><label for="langSel">${t('language')}</label><select id="langSel" data-action-change="set-lang" style="max-width:260px"><option value="ar" ${lang()==='ar'?'selected':''}>العربية</option><option value="en" ${lang()==='en'?'selected':''}>English</option></select></div></div>
      <section class="section"><div class="section-head"><h2>${t('fsTitle')}</h2></div><div class="card card-pad" id="fsBox">${fsBoxHtml()}</div></section>
      <section class="section"><div class="section-head"><h2>${t('aiTitle')}</h2><span class="badge ${ai.key?'':'danger'}">${ai.key ? t('aiOn') : t('aiOff')}</span></div><div class="card card-pad">

const dlg = document.getElementById('dlg');
let dlgState = null;
function openDialog({title, body, submitLabel, extraButtons='', onSubmit, onOpen}){
  dlg.innerHTML = `<form novalidate autocomplete="off"><div class="dlg-head"><h3>${title}</h3><button type="button" class="btn btn-ghost btn-sm" data-dlg="cancel" aria-label="${esc(t('close'))}">✕</button></div>
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot"><button type="button" class="btn" data-dlg="cancel">${t('cancel')}</button>${extraButtons}<button type="submit" class="btn btn-primary" value="save">${submitLabel||t('save')}</button></div></form>`;
  const form = dlg.querySelector('form');
  dlgState = {dirty:false, onSubmit};
  form.addEventListener('input', () => dlgState && (dlgState.dirty = true));
  form.addEventListener('change', () => dlgState && (dlgState.dirty = true));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const which = e.submitter ? e.submitter.value : 'save';
    // validation
    let ok = true;
    form.querySelectorAll('.err').forEach(n => n.remove());
    form.querySelectorAll('[data-required]').forEach(inp => {
      if (inp.closest('[hidden]')) return;
      if (!String(inp.value).trim()){ ok = false; const er = document.createElement('div'); er.className='err'; er.textContent = t('required'); inp.after(er); }
    });
    if (!ok){ form.querySelector('[data-required]:not([hidden])')?.focus(); const firstErr = form.querySelector('.err'); firstErr?.previousElementSibling?.focus(); return; }
    const res = onSubmit(fd, which, form);
    if (res === false) return;
    if (res === 'keep'){ dlgState.dirty = false; return; }
    closeDialog(true);
  });
  form.querySelectorAll('[data-dlg=cancel]').forEach(b => b.addEventListener('click', () => tryCloseDialog()));
  dlg.showModal();
  onOpen && onOpen(form);
  const first = form.querySelector('[autofocus]') || form.querySelector('input:not([type=hidden]),textarea,select');
  first && first.focus();
}
function closeDialog(){ dlgState = null; dlg.close(); dlg.innerHTML=''; }
async function tryCloseDialog(){
  if (dlgState && dlgState.dirty){
    const ok = await confirmBox(t('unsaved'), {ok:t('discard'), cancel:t('keepEditing'), danger:true});
    if (!ok) return;
  }
  closeDialog();
}
dlg.addEventListener('cancel', e => { e.preventDefault(); tryCloseDialog(); });

const cdlg = document.getElementById('confirm');
function confirmBox(msg, {ok, cancel, danger}={}){
  return new Promise(resolve => {
    cdlg.innerHTML = `<div class="dlg-body"><p style="margin:0">${msg}</p></div><div class="dlg-foot"><button type="button" class="btn" data-c="0">${cancel||t('cancel')}</button><button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" data-c="1">${ok||t('save')}</button></div>`;
    const done = v => { cdlg.close(); cdlg.innerHTML=''; resolve(v); };
    cdlg.querySelector('[data-c="0"]').onclick = () => done(false);
    cdlg.querySelector('[data-c="1"]').onclick = () => done(true);
    cdlg.oncancel = e => { e.preventDefault(); done(false); };
    cdlg.showModal();
    cdlg.querySelector('[data-c="1"]').focus();
  });
}

/* ---------- small IndexedDB store (for the folder handle) ---------- */
const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('rafeeq-handles', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(k){ const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};

/* ---------- auto-save folder (File System Access API) ---------- */
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';
const folder = { handle:null, state: FS_SUPPORTED ? 'none' : 'unsupported', lastSave:null, error:null, prunedDay:null };
let fsTimer = null;

async function folderInit(){
  if (!FS_SUPPORTED) return;
  try {
    const h = await idb.get('dir');
    if (!h) { folder.state = 'none'; return; }
    folder.handle = h;
    const p = await h.queryPermission({mode:'readwrite'});
    if (p === 'granted') { folder.state = 'connected'; await syncOnConnect(); }
    else folder.state = 'needs-permission';
  } catch(e){ folder.state = 'none'; }
  refreshFolderUI();
}
async function fsPick(){
  let root;
  try { root = await window.showDirectoryPicker({id:'rafeeq', mode:'readwrite', startIn:'documents'}); }
  catch(e){ return; }
  try {
    let dir = root, hasData = false;
    try { await root.getFileHandle('data.json'); hasData = true; } catch(_){}
    if (!hasData && !/^(rafeeq|رفيق)$/i.test(root.name)) dir = await root.getDirectoryHandle('Rafeeq', {create:true});
    folder.handle = dir; folder.state = 'connected'; folder.error = null;
    await idb.set('dir', dir);
    await syncOnConnect();
    toast(t('fsLinked'));
  } catch(e){ folder.error = e.message || String(e); toast(t('fsErr', {e: folder.error}), 'error'); }
  refreshFolderUI();
}
async function fsReconnect(){
  if (!folder.handle) return fsPick();
  try {
    const p = await folder.handle.requestPermission({mode:'readwrite'});
