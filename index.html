/* ---------- AI (Gemini) settings: kept outside db, never exported ---------- */
const AI_STORE = 'rafeeq.ai';
const GEMINI_MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'];
function aiCfg(){ try { return Object.assign({key:'', model:GEMINI_MODELS[0]}, JSON.parse(localStorage.getItem(AI_STORE) || '{}')); } catch(e){ return {key:'', model:GEMINI_MODELS[0]}; } }
function setAiCfg(c){ try { localStorage.setItem(AI_STORE, JSON.stringify(c)); return true; } catch(e){ toast(t('saveFailed'), 'error'); return false; } }
const aiEnabled = () => !!aiCfg().key;

async function callGemini(system, contents){
  const cfg = aiCfg();
  const models = [cfg.model, ...GEMINI_MODELS.filter(m => m !== cfg.model)];
  let lastErr = {code:'unknown'};
  for (const m of models){
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 30000);
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method:'POST', signal:ctrl.signal,
        headers:{'Content-Type':'application/json', 'x-goog-api-key': cfg.key},
        body: JSON.stringify({ systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{responseMimeType:'application/json', temperature:0.2} })
      });
      clearTimeout(timer);
      if (!res.ok){
        const j = await res.json().catch(() => ({}));
        const msg = j.error?.message || '';
        if (res.status === 401 || res.status === 403 || (res.status === 400 && /api.?key/i.test(msg))) throw {code:'badkey', msg, fatal:true};
        lastErr = {code: res.status, msg};
        continue; // 429 quota, 404 model, 5xx → try next model
      }
      const j = await res.json();
      const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
      if (!text) { lastErr = {code:'empty'}; continue; }
      return {text, model:m};
    } catch(e){
      clearTimeout(timer);
      if (e && e.fatal) throw e;
      lastErr = e && e.name === 'AbortError' ? {code:'timeout'} : (e && e.code ? e : {code:'network'});
      if (!navigator.onLine) break;
    }
  }
  throw lastErr;
}
function fbReason(e){
  const c = e && e.code;
  if (c === 429) return 'fbQuota';
  if (c === 'badkey') return 'fbBadKey';
  if (c === 'parse') return 'fbParse';
  if (!navigator.onLine) return 'fbOffline';
  return 'fbError';
}
function parseJsonLoose(raw){
  if (!raw) return null;
  let s = String(raw).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s); } catch(_){}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a){ try { return JSON.parse(s.slice(a, b+1)); } catch(_){} }
  return null;
}

/* ---------- names: normalization, matching, masking ---------- */
const MARKS = /[ً-ٰٟـ]/g;
const normAr = s => String(s || '').normalize('NFKC').replace(MARKS, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase();
const NAME_TITLES = new Set(['م','د','ا','مهندس','المهندس','دكتور','الدكتور','استاذ','الاستاذ','مدام','الحاج','eng','dr','mr','mrs','ms']);
const nameTokens = s => (normAr(s).match(/[\p{L}\p{N}]+/gu) || []).filter(x => !NAME_TITLES.has(x));
function aliasMap(){
  const map = new Map();
  const add = (k, id) => { if (!map.has(k)) map.set(k, new Set()); map.get(k).add(id); };
  db.people.forEach(p => {
    const tk = nameTokens(p.name); if (!tk.length) return;
    add(tk.join(' '), p.id);
    if (tk[0].length >= 3) add(tk[0], p.id);
    if (tk.length > 2) add(tk.slice(0,2).join(' '), p.id);
  });
  return map;
}
/* Finds known people in free text. Returns [{s,e,ids}] spans on the original string. */
function findPeople(text){
  const map = aliasMap(); if (!map.size) return [];
  const toks = []; const re = /[\p{L}\p{M}\p{N}]+/gu; let m;
  while ((m = re.exec(text))) toks.push({s:m.index, e:m.index + m[0].length, raw:m[0], n:normAr(m[0])});
  const hits = [];
  for (let i = 0; i < toks.length;){
    let hit = null;
    for (let L = 3; L >= 1 && !hit; L--){
      if (i + L > toks.length) continue;
      const seq = toks.slice(i, i+L).map(x => x.n);
      const tries = [{seq, off:0}];
      if (/^[وفبلك]/.test(seq[0]) && seq[0].length > 3){
        let off = 1; const raw = toks[i].raw; while (off < raw.length && /[ً-ٰٟـ]/.test(raw[off])) off++;
        tries.push({seq:[seq[0].slice(1), ...seq.slice(1)], off});
      }
      for (const tr of tries){ const ids = map.get(tr.seq.join(' ')); if (ids){ hit = {L, ids:[...ids], s:toks[i].s + tr.off, e:toks[i+L-1].e}; break; } }
    }
    if (hit){ hits.push(hit); i += hit.L; } else i++;
  }
  return hits;
}
function tokenFor(ids, surface){
  const key = ids.slice().sort().join(',');
  for (const k in chat.tokens) if (chat.tokens[k].slice().sort().join(',') === key) return k;
  chat.seq++;
  const tok = (ids.length === 1 ? 'P' : 'A') + chat.seq;
  chat.tokens[tok] = ids; chat.surface[tok] = surface;
  return tok;
}
function maskPeople(text){
  const hits = findPeople(text); if (!hits.length) return text;
  let out = '', last = 0;
  hits.forEach(h => { out += text.slice(last, h.s) + '⟦' + tokenFor(h.ids, text.slice(h.s, h.e)) + '⟧'; last = h.e; });
  return out + text.slice(last);
}
function unmask(s){
  return String(s || '').replace(/⟦\s*([PA]\d+)\s*⟧/g, (all, tok) => {
    const ids = chat.tokens[tok]; if (!ids) return all;
    return ids.length === 1 && personById(ids[0]) ? personById(ids[0]).name : (chat.surface[tok] || all);
  }).trim();
}
function refToPerson(ref){
  const r = String(ref || '').trim(); if (!r) return null;
  const m = r.match(/^⟦?\s*([PA]\d+)\s*⟧?$/);
  if (m && chat.tokens[m[1]]){
    const ids = chat.tokens[m[1]].filter(id => personById(id));
    if (ids.length === 1) return {rid:uid(), kind:'known', id:ids[0]};
    if (ids.length > 1) return {rid:uid(), kind:'amb', ids, name:''};
  }
  const clean = unmask(r).replace(/[⟦⟧]/g, '').replace(/^(مع|من|ل|لـ)\s+/, '').trim();
  if (!clean) return null;
  const key = nameTokens(clean).join(' ');
  const exact = db.people.filter(p => nameTokens(p.name).join(' ') === key);
  if (exact.length === 1) return {rid:uid(), kind:'known', id:exact[0].id};
  const amb = aliasMap().get(key);
  if (amb && amb.size > 1) return {rid:uid(), kind:'amb', ids:[...amb], name:clean};
  if (amb && amb.size === 1) return {rid:uid(), kind:'known', id:[...amb][0]};
  return {rid:uid(), kind:'new', name:clean};
}

/* ---------- dates helpers for parsing ---------- */
const isWeekend = s => { const d = parseDate(s).getDay(); return d === 5 || d === 6; }; // Fri, Sat
function addWorkdays(s, n){ let d = s, step = n < 0 ? -1 : 1, left = Math.abs(n); while (left > 0){ d = addDays(d, step); if (!isWeekend(d)) left--; } return d; }
function validDate(v){ if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null; const d = parseDate(v); return isNaN(d) || toDateStr(d) !== v ? null : v; }
function lastOfMonth(s){ const d = parseDate(s); return toDateStr(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
function nextWeekday(s, wd){ let d = addDays(s, 1); while (parseDate(d).getDay() !== wd) d = addDays(d, 1); return d; }
const fmtDateWd = s => new Intl.DateTimeFormat(locale(), {weekday:'long', day:'numeric', month:'short'}).format(parseDate(s));

/* ---------- local fallback parser (no AI) ---------- */
const WEEKDAYS = [['الاحد','الحد','sunday'],['الاثنين','الاتنين','monday'],['الثلاثاء','التلات','الثلاث','tuesday'],['الاربعاء','الاربع','wednesday'],['الخميس','thursday'],['الجمعه','friday'],['السبت','saturday']];
function localDue(n, td){
  if (/(بعد\s*بكر[هةا]|بعد\s*غد|day after tomorrow)/.test(n)) return addDays(td, 2);
  if (/(النهارده|النهارده|اليوم|today)/.test(n)) return td;
  if (/(بكر[هةا]|غدا|tomorrow)/.test(n)) return addDays(td, 1);
  let m = n.match(/بعد\s+(\d+)\s*(يوم|ايام)|in\s+(\d+)\s+days?/); if (m) return addDays(td, +(m[1] || m[3]));
  if (/بعد\s+يومين/.test(n)) return addDays(td, 2);
  if (/بعد\s+(اسبوع|اسبوعين)|in a week/.test(n)) return addDays(td, /اسبوعين/.test(n) ? 14 : 7);
  if (/(اخر|نهايه)\s+الشهر|end of (the )?month/.test(n)) return lastOfMonth(td);
  if (/(اخر|نهايه)\s+الاسبوع|end of (the )?week/.test(n)) return nextWeekday(td, 4);
  if (/الاسبوع\s+(الجاي|القادم|اللي\s+جاي)|next week/.test(n)) return nextWeekday(td, 0);
  for (let i = 0; i < WEEKDAYS.length; i++) for (const w of WEEKDAYS[i]) if (new RegExp('(^|[^\\p{L}])(يوم\\s+)?' + w + '([^\\p{L}]|$)', 'u').test(n)) return nextWeekday(td, i);
  m = n.match(/(^|[^\d])(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?(?!\d)/);
  if (m){ let y = m[4] ? +m[4] : +td.slice(0,4); if (y < 100) y += 2000; const v = validDate(`${y}-${pad(+m[3])}-${pad(+m[2])}`); if (v){ return (!m[4] && v < td) ? validDate(`${y+1}-${pad(+m[3])}-${pad(+m[2])}`) : v; } }
  return null;
}
function localParse(text){
  const n = ' ' + normAr(text) + ' ', td = todayStr();
  const due = localDue(n, td);
  const priority = /(عاجل|ضروري|مهم\s+جدا|urgent|asap)/.test(n) ? 'high' : /(مش\s+مستعجل|غير\s+مستعجل|لما\s+افضي|low priority)/.test(n) ? 'low' : 'medium';
  const people = findPeople(text).map(h => '⟦' + tokenFor(h.ids, text.slice(h.s, h.e)) + '⟧');
  const waiting = /(مستني|منتظر|بانتظار|waiting)/.test(n) && people.length;
  const needFu = /(اتابع|متابعه|اكلم|اتصل|اسال|اذكر|follow\s*up|call|ask|remind)/.test(n);
  const fuDue = due ? (diffDays(due, td) > 1 ? addWorkdays(due, -1) : due) : addWorkdays(td, 1);
  const title = text.trim().replace(/\s+/g, ' ').slice(0, 160);
  return {status:'ready', reply:'', tasks:[{
    title, desc:'', due, priority,
    status: waiting ? 'waiting' : 'not_started',
    waitingOn: waiting ? people[0] : null,
    waitingWhat: /(اعتماد|موافقه|approval|approve)/.test(n) ? 'approval' : /(قرار|decision)/.test(n) ? 'decision' : 'reply',
    project:null, source:null, role:'exec',
    followups: needFu ? people.map(p => ({person:p, what:title, due:fuDue})) : []
  }]};
}

/* ---------- chat ---------- */
const chat = { open:false, msgs:[], history:[], tokens:{}, surface:{}, seq:0, busy:false, refs:new Map() };
function resetChatContext(){ chat.history = []; chat.tokens = {}; chat.surface = {}; chat.seq = 0; }
function buildSystem(){
  const td = todayStr();
  const wd = new Intl.DateTimeFormat('en-US', {weekday:'long'}).format(parseDate(td));
  const projects = [...new Set(db.tasks.map(x => (x.project || '').trim()).filter(Boolean))].slice(0, 40);
  return `You are the task-capture assistant inside "Rafeeq", a personal work organizer. The user describes work in free text (often Egyptian or Gulf Arabic dialect, sometimes English or mixed). Turn it into structured task drafts.

Today is ${td} (${wd}). Work week: Sunday–Thursday; Friday and Saturday are the weekend.
DATES — output YYYY-MM-DD. "بكرة/بكره/غدًا/tomorrow" = tomorrow. "بعد بكرة" = day after tomorrow. A weekday name ("الخميس") = its next occurrence after today. "الأسبوع الجاي" with no day = next Sunday. "آخر الأسبوع" = the coming Thursday. "آخر الشهر" = last day of this month. Vague deadlines ("قريب", "في أقرب وقت") → due null.
PEOPLE — tokens like ⟦P1⟧ are known people whose names are hidden for privacy; ⟦A1⟧ are ambiguous known names. Use such tokens exactly as the person value and never invent names for them. Any other person name is a new person: give the name as written, without prepositions (مع، من، لـ), keeping titles like م. or د.
FIELDS — title: short phrase in the user's language (max ~80 chars), no dates; details go in desc. priority: "high" for عاجل/ضروري/مهم جدًا/urgent, "low" for مش مستعجل/لما أفضى, else "medium". status: "in_progress" if the user already started ("شغال فيه"/"بدأت"), "waiting" if blocked on someone ("مستني رد/اعتماد/قرار من") with waitingOn and waitingWhat ("reply"|"decision"|"approval"), else "not_started". role: "follow" if someone else executes and the user follows up ("خلي فلان يعمل"), "both" if both, else "exec". project: reuse an existing name when the user refers to it${projects.length ? ` (existing: ${projects.join(' | ')})` : ''}, else null. source: who assigned it, if said.
FOLLOW-UPS — when the user needs something from a person (أتابع مع، أكلم، أسأل، أخلي فلان يرد/يعتمد…), add {person, what, due}. If no follow-up timing is given: 1 working day before the task due date when that is later than today, otherwise the next working day.
ASKING — only the title is essential. Ask ONE short question only when the text is too unclear to form a task, or when the user clearly wants to follow up with someone but the timing is truly ambiguous and matters. Never ask about priority, project, role, description, or anything you can default. Never ask more than 2 questions in a row; then use defaults.
Several tasks in one message → several items. If the user corrects a previous draft, return the full updated list of drafts. If the message is not a task (greeting/question), use status "chat" and reply briefly that you capture tasks.
reply: one or two short sentences in the user's language and tone. When status is "ready", briefly confirm; the app shows the cards.

Return ONLY this JSON:
{"status":"ready"|"ask"|"chat","reply":string,"tasks":[{"title":string,"desc":string,"due":string|null,"priority":"high"|"medium"|"low","status":"not_started"|"in_progress"|"waiting","waitingOn":string|null,"waitingWhat":"reply"|"decision"|"approval"|null,"project":string|null,"source":string|null,"role":"exec"|"follow"|"both","followups":[{"person":string,"what":string,"due":string|null}]}]}`;
}
const str = v => typeof v === 'string' ? v.trim() : '';
function normalizeDrafts(arr){
  return (Array.isArray(arr) ? arr : []).slice(0, 10).map(x => {
    const title = unmask(str(x.title)).slice(0, 300);
    return {
      title, desc: unmask(str(x.desc)), due: validDate(x.due),
      priority: PRIOS.includes(x.priority) ? x.priority : 'medium',
      status: ['not_started','in_progress','waiting'].includes(x.status) ? x.status : 'not_started',
      waitingOn: x.waitingOn ? refToPerson(x.waitingOn) : null,
      waitingWhat: WAITS.includes(x.waitingWhat) ? x.waitingWhat : 'reply',
      project: unmask(str(x.project)), source: unmask(str(x.source)),
      role: ROLES.includes(x.role) ? x.role : 'exec',
      followups: (Array.isArray(x.followups) ? x.followups : []).slice(0, 10)
        .map(f => ({person: refToPerson(f && f.person), what: unmask(str(f && f.what)) || title, due: validDate(f && f.due) || addWorkdays(todayStr(), 1)}))
        .filter(f => f.person)
    };
  }).filter(x => x.title);
}
function openChat(prefill){
  chat.open = true;
  buildChatShell();
  if (prefill) chatSend(prefill);
  setTimeout(() => document.getElementById('chatInput')?.focus(), 30);
}
function closeChat(){ chat.open = false; const el = document.getElementById('chat'); el.hidden = true; el.innerHTML = ''; stopMic(); }
function buildChatShell(){
  const el = document.getElementById('chat');
  if (!chat.open){ el.hidden = true; return; }
  const ai = aiEnabled();
  const SRok = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  el.innerHTML = `<div class="chat-head">
      <h3>${t('chatOpen')}</h3>
      <a href="#settings" class="engine ${ai ? '' : 'local'}" title="${esc(t('aiTitle'))}">${ai ? 'Gemini' : t('engineLocal')}</a>
      <span style="flex:1"></span>
      <button type="button" class="btn btn-sm btn-ghost" data-action="chat-form">${t('chatForm')}</button>
      <button type="button" class="btn btn-sm btn-ghost" data-action="chat-clear" title="${esc(t('chatClear'))}">${t('chatClear')}</button>
      <button type="button" class="btn btn-sm btn-ghost" data-action="chat-close" aria-label="${esc(t('chatClose'))}">✕</button>
    </div>
    <div class="chat-body" id="chatBody" aria-live="polite"></div>
    <form class="chat-foot" data-form="chat" autocomplete="off">
      ${SRok ? `<button type="button" class="btn mic" data-action="chat-mic" id="micBtn" title="${esc(t('chatMic'))}" aria-label="${esc(t('chatMic'))}">${IC.mic}</button>` : ''}
      <textarea id="chatInput" rows="1" dir="auto" placeholder="${esc(t('chatPh'))}" aria-label="${esc(t('chatPh'))}"></textarea>
      <button type="submit" class="btn btn-primary" aria-label="${esc(t('chatSend'))}" title="${esc(t('chatSend'))}">${IC.send}</button>
    </form>`;
  el.hidden = false;
  renderChatBody();
  updateMicBtn();
}
function personSelect(ref){
  chat.refs.set(ref.rid, ref);
  const people = db.people.slice().sort((a,b) => a.name.localeCompare(b.name));
  let opts = '';
  if (ref.kind === 'amb'){
    opts += `<option value="" selected disabled>${t('draftChoose')}</option>`;
    ref.ids.forEach(id => { const p = personById(id); if (p) opts += `<option value="${p.id}">${esc(p.name)}</option>`; });
    opts += '<option disabled>──────</option>';
  }
  if (ref.name && ref.kind !== 'amb') opts += `<option value="new" ${ref.kind === 'new' ? 'selected' : ''}>${esc(ref.name)} · ${t('draftNew')}</option>`;
  people.forEach(p => { if (ref.kind === 'amb' && ref.ids.includes(p.id)) return; opts += `<option value="${p.id}" ${ref.kind === 'known' && ref.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`; });
  return `<select data-rid="${ref.rid}" class="${ref.kind === 'amb' ? 'need' : ''}" aria-label="${esc(t('person'))}">${opts}</select>`;
}
function draftCard(d, active){
  const td = todayStr();
  const dueTxt = d.due ? `${fmtDateWd(d.due)}${d.due < td ? ` <span class="pill late">${t('draftPast')}</span>` : ''}` : t('draftNoDue');
  const lines = [];
  lines.push(`<span>🗓 ${t('due')}: ${dueTxt}</span>`);
  if (d.priority !== 'medium') lines.push(prioPill(d.priority));
  if (d.status !== 'not_started') lines.push(statusPill(d.status));
  if (d.role !== 'exec') lines.push(`<span class="pill">${t('role_'+d.role)}</span>`);
  if (d.project) lines.push(`<span dir="auto">📁 ${esc(d.project)}</span>`);
  if (d.source) lines.push(`<span dir="auto">${t('from',{s:esc(d.source)})}</span>`);
  const sel = ref => active ? personSelect(ref) : `<bdi><strong>${esc(ref.kind === 'known' ? personName(ref.id) : (ref.name || '?'))}</strong></bdi>`;
  let html = `<div class="draft-title" dir="auto">${esc(d.title)}</div>`;
  if (d.desc) html += `<div class="draft-line" dir="auto">${esc(d.desc)}</div>`;
  html += `<div class="draft-line">${lines.join('')}</div>`;
  if (d.status === 'waiting' && d.waitingOn) html += `<div class="draft-line">⏳ ${t('draftWaiting',{w:t('wait_'+d.waitingWhat)})} ${sel(d.waitingOn)}</div>`;
  d.followups.forEach(f => { html += `<div class="draft-line">↳ ${t('draftFu')} ${sel(f.person)}${f.what && f.what !== d.title ? ` <span dir="auto">— ${esc(f.what)}</span>` : ''} · ${fmtDateWd(f.due)}</div>`; });
  return `<div class="draft-card">${html}</div>`;
}
function renderChatBody(){
  const body = document.getElementById('chatBody'); if (!body) return;
  const parts = [];
  if (!chat.msgs.length) parts.push(`<div class="msg bot">${esc(t('chatHello'))}</div>`);
  chat.msgs.forEach((m, i) => {
    if (m.role === 'user') parts.push(`<div class="msg user" dir="auto">${esc(m.text)}</div>`);
    else if (m.role === 'bot') parts.push(`<div class="msg bot" dir="auto">${esc(m.text)}</div>`);
    else if (m.role === 'note') parts.push(`<div class="msg note">${esc(t(m.key))}</div>`);
    else if (m.role === 'drafts'){
      const active = m.state === 'active';
      let h = `<div class="drafts ${m.state}">`;
      if (m.local) h += `<div class="small muted" style="margin-bottom:6px">${t('localNote')}</div>`;
      h += m.drafts.map(d => draftCard(d, active)).join('');
      if (active) h += `<div class="chat-actions"><button type="button" class="btn btn-primary" data-action="draft-save" data-i="${i}">${IC.check}${m.drafts.length > 1 ? t('draftSaveAll',{n:m.drafts.length}) : t('draftSave')}</button><button type="button" class="btn" data-action="draft-discard" data-i="${i}">${t('draftDiscard')}</button></div><div class="small muted">${m.local ? t('localHint') : t('draftHint')}</div>`;
      else if (m.state === 'saved') h += `<div class="small" style="color:var(--ok);font-weight:600">${t('draftSavedMsg')} ${(m.created || []).map(id => { const x = taskById(id); return x ? `<a href="#task/${id}" dir="auto">${esc(x.title)}</a>` : ''; }).join(' · ')}</div>`;
      else if (m.state === 'discarded') h += `<div class="small muted">${t('draftDiscardedMsg')}</div>`;
      else h += `<div class="small muted">${t('draftStale')}</div>`;
      parts.push(h + '</div>');
    }
  });
  if (chat.busy) parts.push(`<div class="msg bot typing">${t('chatThinking')}</div>`);
  body.innerHTML = parts.join('');
  body.scrollTop = body.scrollHeight;
}
async function chatSend(text){
  text = (text || '').trim();
  if (!text || chat.busy) return;
  chat.msgs.push({role:'user', text});
  chat.busy = true; renderChatBody();
  let result = null, note = null;
  const masked = maskPeople(text);
  if (aiEnabled() && navigator.onLine){
    chat.history.push({role:'user', parts:[{text:masked}]});
    try {
      const {text:raw} = await callGemini(buildSystem(), chat.history);
      const j = parseJsonLoose(raw);
      if (!j || typeof j !== 'object') throw {code:'parse'};
      chat.history.push({role:'model', parts:[{text:raw}]});
      result = j;
    } catch(e){ chat.history.pop(); note = fbReason(e); }
  } else note = aiEnabled() ? 'fbOffline' : 'fbNoKey';
  if (!result){ result = localParse(text); result._local = true; }
  chat.busy = false;
  if (note) chat.msgs.push({role:'note', key:note});
  handleResult(result);
  renderChatBody();
}
function handleResult(j){
  const drafts = normalizeDrafts(j.tasks);
  const reply = unmask(str(j.reply));
  if (j.status === 'chat' || (!drafts.length && j.status !== 'ask')){
    chat.msgs.push({role:'bot', text: reply || t('chatNotTask')});
    return;
  }
  if (reply) chat.msgs.push({role:'bot', text: reply});
  if (j.status === 'ask') return;
  chat.msgs.forEach(m => { if (m.role === 'drafts' && m.state === 'active') m.state = 'stale'; });
  chat.msgs.push({role:'drafts', drafts, local: !!j._local, state:'active'});
}
function resolveRef(ref){
  if (!ref) return null;
  if (ref.kind === 'known') return personById(ref.id) ? ref.id : null;
  if (ref.kind === 'new') return getOrCreatePerson(ref.name);
  return null;
}
function saveDrafts(i){
  const m = chat.msgs[i]; if (!m || m.state !== 'active') return;
  const refs = m.drafts.flatMap(d => [d.status === 'waiting' ? d.waitingOn : null, ...d.followups.map(f => f.person)]).filter(Boolean);
  if (refs.some(r => r.kind === 'amb')){
    toast(t('draftNeedChoice'), 'error');
    document.querySelector('#chatBody select.need')?.focus();
    return;
  }
  const created = [];
  m.drafts.forEach(d => {
    const tk = {id:uid(), createdAt:nowISO(), title:d.title, desc:d.desc, status:d.status, priority:d.priority, role:d.role, due:d.due || '', project:d.project, source:d.source, links:'', notes:'', waitingOn:null, waitingWhat:d.waitingWhat, followups:[], log:[], archived:false, completedAt:null, result:'', deliverable:''};
    if (d.status === 'waiting' && d.waitingOn) tk.waitingOn = resolveRef(d.waitingOn);
    db.tasks.push(tk); addLog(tk, 'created');
    d.followups.forEach(f => {
      const pid = resolveRef(f.person); if (!pid) return;
      const fu = {id:uid(), personId:pid, what:f.what, due:f.due, status:'open', createdAt:nowISO(), closedOn:null, log:[]};
      tk.followups.push(fu); addLog(tk, 'fu_added', {personId:pid, what:fu.what});
    });
    created.push(tk.id);
  });
  if (!persist()) return;
  m.state = 'saved'; m.created = created;
  resetChatContext();
  toast(t('saved')); render(true); renderChatBody();
  document.getElementById('chatInput')?.focus();
}
function discardDrafts(i){
  const m = chat.msgs[i]; if (!m) return;
  m.state = 'discarded'; resetChatContext(); renderChatBody();
}

/* voice input */
let rec = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (rec){ rec.stop(); return; }
  const ta = document.getElementById('chatInput'); if (!ta) return;
  rec = new SR(); rec.lang = lang() === 'ar' ? 'ar-EG' : 'en-US'; rec.interimResults = true; rec.continuous = true;
  const base = ta.value ? ta.value.trimEnd() + ' ' : ''; let finalText = '';
  rec.onresult = e => { let interim = ''; for (let k = e.resultIndex; k < e.results.length; k++){ const r = e.results[k]; if (r.isFinal) finalText += r[0].transcript + ' '; else interim += r[0].transcript; } ta.value = base + finalText + interim; autoGrow(ta); };
  rec.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast(t('micDenied'), 'error'); };
  rec.onend = () => { rec = null; updateMicBtn(); };
  try { rec.start(); } catch(_){ rec = null; }
  updateMicBtn();
}
function stopMic(){ if (rec){ try { rec.stop(); } catch(_){} } }
function updateMicBtn(){ const b = document.getElementById('micBtn'); if (b) b.classList.toggle('on', !!rec); }
function autoGrow(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }


/* ---------- toast ---------- */
let toastTimer;
function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast' + (kind ? ' '+kind : ''); el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, kind==='error' ? 6000 : 2200);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-action]');
  if (a && !a.matches('select,input')){
    const act = a.dataset.action, id = a.dataset.id;
    const tk = id ? taskById(id) : (a.dataset.task ? taskById(a.dataset.task) : null);
    const fu = tk && a.dataset.fu ? tk.followups.find(f => f.id===a.dataset.fu) : null;
    e.preventDefault(); e.stopPropagation();
    switch(act){
      case 'new-task': taskForm(); break;
      case 'edit-task': tk && taskForm(tk); break;
      case 'complete': tk && isOpen(tk) && completeDialog(tk); break;
      case 'reopen': if (tk){ const prev = tk.completedAt; tk.status='in_progress'; addLog(tk,'reopened',{prev}, tk.result ? tk.result : ''); tk.completedAt=null; tk.result=''; tk.deliverable=''; persist(); render(true); } break;
      case 'archive': if (tk){ tk.archived = !tk.archived; addLog(tk, tk.archived?'archived':'unarchived'); persist(); toast(t('saved')); render(true); } break;
      case 'delete-task': if (tk && await confirmBox(t('delTaskConfirm'), {ok:t('del'), danger:true})){ db.tasks = db.tasks.filter(x=>x!==tk); persist(); toast(t('deleted')); location.hash = '#tasks'; } break;
      case 'add-fu': tk && followupDialog(tk); break;
      case 'edit-fu': tk && fu && followupDialog(tk, fu); break;
      case 'fu-result': tk && fu && fuResultDialog(tk, fu); break;
      case 'reopen-fu': if (fu){ fu.status='open'; fu.closedOn=null; if (!fu.due || fu.due < todayStr()) fu.due = todayStr(); tk.updatedAt=nowISO(); persist(); render(true); } break;
      case 'delete-fu': if (fu && await confirmBox(t('delFuConfirm'), {ok:t('del'), danger:true})){ tk.followups = tk.followups.filter(f=>f!==fu); persist(); render(true); } break;
      case 'add-person': personDialog(); break;
      case 'edit-person': { const p = personById(id); p && personDialog(p); break; }
      case 'delete-person': { const p = personById(id); if (p && await confirmBox(t('delPersonConfirm'), {ok:t('del'), danger:true})){ db.people = db.people.filter(x=>x!==p); if (ui.taskFilter.person===p.id) ui.taskFilter.person=''; persist(); toast(t('deleted')); location.hash = '#people'; } break; }
      case 'toggle-lang': setLang(lang()==='ar' ? 'en' : 'ar'); break;
      case 'tf-view': ui.taskFilter.view = a.dataset.v; ui.taskFilter.status=''; render(); break;
      case 'export': exportData(); break;
      case 'import': document.getElementById('importFile').click(); break;
      case 'persist': if (navigator.storage?.persist){ await navigator.storage.persist(); refreshPersistStatus(); } break;
      case 'clear-all': if (await confirmBox(t('clearConfirm'), {ok:t('clearAll'), danger:true})){ const l = db.settings.lang; db = emptyDB(); db.settings.lang = l; persist(); toast(t('cleared')); location.hash = '#today'; render(); } break;
      case 'print': window.print(); break;
      case 'chat-open': openChat(); break;
      case 'chat-close': closeChat(); break;
      case 'chat-clear': chat.msgs = []; resetChatContext(); renderChatBody(); document.getElementById('chatInput')?.focus(); break;
      case 'chat-form': taskForm(); break;
      case 'chat-mic': toggleMic(); break;
      case 'draft-save': saveDrafts(+a.dataset.i); break;
      case 'draft-discard': discardDrafts(+a.dataset.i); break;
      case 'fs-pick': await fsPick(); break;
      case 'fs-reconnect': await fsReconnect(); break;
      case 'fs-unlink': await fsUnlink(); break;
      case 'fs-restore': { const v = document.getElementById('snapSel')?.value; if (v) await restoreSnapshot(v); break; }
      case 'ai-remove': { const c = aiCfg(); c.key = ''; setAiCfg(c); toast(t('aiKeyRemoved')); render(true); if (chat.open) buildChatShell(); break; }
      case 'ai-test': {
        const out = document.getElementById('aiTestOut'); out.style.color = ''; out.textContent = t('aiTesting');
        try { const r = await callGemini('Reply with this exact JSON: {"ok":true}', [{role:'user', parts:[{text:'ping'}]}]); out.style.color = 'var(--ok)'; out.textContent = t('aiTestOk', {m:r.model}); }
        catch(err){ out.style.color = 'var(--danger)'; out.textContent = t('aiTestFail', {e: err.code === 429 ? t('fbQuota') : (err.msg || err.code || 'error')}); }
        break;
      }
    }
    return;
  }
  const row = e.target.closest('[data-href]');
  if (row && !e.target.closest('a,button,input,select,textarea')) location.hash = row.dataset.href;
});
document.addEventListener('keydown', e => {
  const row = e.target.closest && e.target.closest('[data-href]');
  if (row && e.target === row && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); location.hash = row.dataset.href; return; }
  if (e.target.id==='chatInput' && e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.key==='Escape' && chat.open && !dlg.open && !cdlg.open){ e.preventDefault(); closeChat(); return; }
  if (e.key==='/' && !dlg.open && !cdlg.open && !e.target.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); openChat(); return; }
  if ((e.key==='n' || e.key==='N' || e.key==='ى') && !e.ctrlKey && !e.metaKey && !e.altKey && !dlg.open && !cdlg.open && !e.target.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); taskForm(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id==='importFile' && el.files[0]){ importFile(el.files[0]); el.value=''; return; }
  if (el.dataset.filter){ ui.taskFilter[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.rid){
    const ref = chat.refs.get(el.dataset.rid); if (!ref) return;
    if (el.value === 'new') ref.kind = 'new';
    else if (el.value){ ref.kind = 'known'; ref.id = el.value; }
    el.classList.remove('need');
    return;
  }
  const act = el.dataset.actionChange;
  if (act==='set-status'){
    const tk = taskById(el.dataset.id); if (!tk) return;
    const prev = tk.status; tk.status = el.value;
    if (tk.status!=='waiting') tk.waitingOn = null;
    addLog(tk, 'status', {from:prev, to:tk.status}); persist(); toast(t('saved')); render(true);
    if (tk.status==='waiting') taskForm(tk);
  } else if (act==='wins-month'){ if (el.value){ ui.winsMonth = el.value; render(); } }
  else if (act==='set-lang'){ setLang(el.value); }
  else if (act==='ai-model'){ const c = aiCfg(); c.model = el.value; setAiCfg(c); toast(t('saved')); }
});
let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id==='chatInput'){ autoGrow(e.target); return; }
  if (e.target.id==='taskSearch'){
    ui.taskFilter.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const s = document.getElementById('taskSearch'); s.focus(); try{ s.setSelectionRange(pos,pos); }catch(_){} }, 180);
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form==='quick'){
    e.preventDefault();
    const title = f.elements.title.value.trim(); if (!title) return;
    f.elements.title.value = '';
    openChat(title);
  } else if (f.dataset.form==='chat'){
    e.preventDefault();
    const ta = f.querySelector('textarea'); const v = ta.value.trim(); if (!v) return;
    stopMic(); ta.value = ''; autoGrow(ta);
    chatSend(v);
  } else if (f.dataset.form==='ai'){
    e.preventDefault();
    const c = aiCfg(); c.key = f.elements.key.value.trim(); if (!setAiCfg(c)) return;
    toast(c.key ? t('aiKeySaved') : t('aiKeyRemoved')); render(true); if (chat.open) buildChatShell();
  } else if (f.dataset.form==='update'){
    e.preventDefault();
    const tk = taskById(f.dataset.task); const text = f.elements.text.value.trim(); if (!tk || !text) return;
    addLog(tk, 'note', {}, text);
    if (tk.status==='not_started'){ addLog(tk, 'status', {from:'not_started', to:'in_progress'}); tk.status='in_progress'; }
    if (persist()){ toast(t('saved')); render(true); }
  }
});
window.addEventListener('hashchange', () => { if (chat.open && matchMedia('(max-width: 720px)').matches) closeChat(); render(); window.scrollTo(0,0); document.getElementById('main').focus({preventScroll:true}); });
window.addEventListener('storage', e => { if (e.key===STORE_KEY && !dlg.open){ db = loadDB(); render(true); } });

function setLang(l){ db.settings.lang = l; persist(); render(true); if (chat.open) buildChatShell(); }

/* ---------- boot ---------- */
function showWelcome(){
  const w = document.getElementById('welcome');
  w.innerHTML = `<div class="card"><div class="brand-mark">ر</div><h2 style="margin:0 0 4px">رفيق · Rafeeq</h2><p class="muted" style="margin:0">اختر لغة الواجهة<br>Choose interface language</p>
    <div class="btn-group"><button class="btn btn-primary" data-lang="ar" type="button">العربية</button><button class="btn" data-lang="en" type="button">English</button></div></div>`;
  w.hidden = false;
  w.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { db.settings.lang = b.dataset.lang; persist(); w.hidden = true; render(); if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{}); });
}
render();
if (!db.settings.lang) showWelcome();
if (!storageOK) setTimeout(() => toast(t('storageUnavailable'), 'error'), 300);
folderInit();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
